name: Build Offline Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web App & Capacitor Android
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html is missing from the main folder."
            exit 1
          fi
          mkdir -p www
          cp index.html www/
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f sw.js ] && cp sw.js www/ || true
          [ -f package.json ] || npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          [ -f capacitor.config.json ] || npx cap init "Krishna LPG" "com.krishnaenterprises.lpg" --web-dir www
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: krishna-lpg-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
