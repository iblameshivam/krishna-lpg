<script>
(() => {
  'use strict';

  const BRANDS = ['Bharatgas', 'HP Gas', 'Indane', 'Private'];
  const SIZES = ['5 kg', '14.2 kg', '19 kg', '35 kg', '47.5 kg'];
  const CUST_TYPES = ['Household', 'Commercial', 'Other'];
  const MAIN_DB_NAME = 'KrishnaEnterprisesLPG_v1';

  // ---------- FORMATTERS & HELPERS ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  function toPaise(val) {
    if (typeof val === 'number') return Number.isFinite(val) ? Math.round(val * 100) : 0;
    const cleaned = String(val || '').trim().replace(/,/g, '');
    if (!cleaned) return 0;
    const neg = cleaned.startsWith('-');
    const abs = neg ? cleaned.slice(1) : cleaned;
    const [w = '0', f = ''] = abs.split('.');
    const whole = parseInt(w || '0', 10);
    if (Number.isNaN(whole)) return 0;
    let frac = parseInt((f + '00').slice(0, 2), 10) || 0;
    if (f.length > 2 && parseInt(f[2], 10) >= 5) frac += 1;
    const total = whole * 100 + frac;
    return neg ? -total : total;
  }

  function paiseInput(p) {
    if (!p) return '';
    return (p / 100).toFixed(2).replace(/\.00$/, '');
  }

  function formatINR(paise) {
    const safe = Math.round(paise || 0);
    const neg = safe < 0;
    const [intP, decP] = (Math.abs(safe) / 100).toFixed(2).split('.');
    return `${neg ? '-' : ''}₹${Number(intP).toLocaleString('en-IN')}.${decP}`;
  }

  function getISTDateKey(ms = Date.now()) {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date(ms));
  }

  function shiftIST(istDate, days) {
    const [y, m, d] = istDate.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d + days));
    return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, '0')}-${String(dt.getUTCDate()).padStart(2, '0')}`;
  }

  function monthStartIST(istDate) { return `${istDate.slice(0, 7)}-01`; }

  function fmtDateIST(ms) {
    return new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Kolkata', day: '2-digit', month: '2-digit', year: 'numeric'
    }).format(new Date(ms));
  }

  function fmtTimeIST(ms) {
    return new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: true
    }).format(new Date(ms));
  }

  function fmtKeyDisp(k) {
    const [y, m, d] = k.split('-');
    return y && m && d ? `${d}/${m}/${y}` : k;
  }

  function genId(prefix) {
    return `${prefix}-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`;
  }

  function invKey(brand, size) { return `${brand}__${size}`; }

  function downloadFile(name, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function csvCell(v) {
    const s = String(v ?? '');
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }

  function buildWhatsAppUrl(c, lastSaleText) {
    const dueLine = c.duePaise > 0
      ? `• *Pending Due / बकाया:* ${formatINR(c.duePaise)}`
      : c.duePaise < 0
      ? `• *Advance Credit:* ${formatINR(Math.abs(c.duePaise))}`
      : `• *Pending Due:* ₹0.00 (Settled)`;
    const lines = [
      `*Krishna Enterprises - LPG Agency*`,
      `नमस्ते *${c.name}* (${c.id}) 🙏`,
      ``,
      `*Hisab Summary (${fmtDateIST(Date.now())}):*`,
      lastSaleText ? `• ${lastSaleText}` : null,
      c.fullCylindersHeld > 0 ? `• Full Held: ${c.fullCylindersHeld}` : null,
      `• Empty Pending/Owed: ${c.emptyCylindersOwed}`,
      c.advanceEmptyDeposits > 0 ? `• Advance Empty Deposits: ${c.advanceEmptyDeposits}` : null,
      dueLine,
      ``,
      `कृपया बकाया राशि और खाली सिलेंडर समय पर जमा कराएं। धन्यवाद!`
    ].filter(Boolean).join('\n');
    const digits = (c.phone || '').replace(/\D/g, '');
    if (digits.length === 10) return `https://wa.me/91${digits}?text=${encodeURIComponent(lines)}`;
    if (digits.length > 10) return `https://wa.me/${digits}?text=${encodeURIComponent(lines)}`;
    return `https://wa.me/?text=${encodeURIComponent(lines)}`;
  }

  // ---------- INDEXEDDB WRAPPER ----------
  function openDB(name = MAIN_DB_NAME) {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(name, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('customers')) db.createObjectStore('customers', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('inventory')) db.createObjectStore('inventory', { keyPath: 'key' });
        if (!db.objectStoreNames.contains('transactions')) {
          const ts = db.createObjectStore('transactions', { keyPath: 'id' });
          ts.createIndex('istDate', 'istDate', { unique: false });
          ts.createIndex('customerId', 'customerId', { unique: false });
          ts.createIndex('type', 'type', { unique: false });
        }
        if (!db.objectStoreNames.contains('customerMoneyLedger')) {
          db.createObjectStore('customerMoneyLedger', { keyPath: 'id' }).createIndex('customerId', 'customerId');
        }
        if (!db.objectStoreNames.contains('emptyCylinderLedger')) {
          db.createObjectStore('emptyCylinderLedger', { keyPath: 'id' }).createIndex('customerId', 'customerId');
        }
        if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
        if (!db.objectStoreNames.contains('dailyCash')) db.createObjectStore('dailyCash', { keyPath: 'istDate' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  const reqP = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

  function runTx(db, storeNames, mode, work) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeNames, mode);
      const stores = {};
      storeNames.forEach((n) => { stores[n] = tx.objectStore(n); });
      let out, errRef = null;
      tx.oncomplete = () => errRef ? reject(errRef) : resolve(out);
      tx.onerror = () => reject(errRef || tx.error || new Error('DB error'));
      tx.onabort = () => reject(errRef || tx.error || new Error('Transaction aborted'));
      Promise.resolve().then(() => work(stores)).then((r) => { out = r; }).catch((e) => {
        errRef = e;
        try { tx.abort(); } catch (_) {}
      });
    });
  }

  const getAll = (db, store) => runTx(db, [store], 'readonly', (s) => reqP(s[store].getAll()));
  const getByKey = (db, store, k) => runTx(db, [store], 'readonly', (s) => reqP(s[store].get(k)));
  const getByIndex = (db, store, idx, val) => runTx(db, [store], 'readonly', (s) => reqP(s[store].index(idx).getAll(val)));

  // ---------- ACCOUNTING ENGINE ----------
  async function getOrInitInv(invStore, brand, size) {
    const key = invKey(brand, size);
    const ex = await reqP(invStore.get(key));
    return ex || { key, brand, size, fullStock: 0, emptyStock: 0, avgCostPaise: 0, lastPurchasePricePaise: 0, updatedAt: Date.now() };
  }

  async function createCustomer(db, input) {
    const name = (input.name || '').trim();
    if (!name) throw new Error('Customer name is required.');
    const openDue = Math.round(input.openingDuePaise || 0);
    const openFull = Math.max(0, Math.floor(input.openingFullCylinders || 0));
    const openEmpty = Math.max(0, Math.floor(input.openingEmptyCylinders || 0));
    const now = Date.now(), istDate = getISTDateKey(now);

    return runTx(db, ['customers', 'transactions', 'customerMoneyLedger', 'emptyCylinderLedger', 'settings'], 'readwrite', async (s) => {
      const lastSet = await reqP(s.settings.get('lastCustomerNum'));
      const nextNum = lastSet ? Number(lastSet.value) + 1 : 1001;
      await reqP(s.settings.put({ key: 'lastCustomerNum', value: nextNum }));
      const customer = {
        id: `KE-${nextNum}`, name, phone: (input.phone || '').trim(), address: (input.address || '').trim(),
        type: input.type || 'Household',
        contractPricePaise: input.contractPricePaise > 0 ? Math.round(input.contractPricePaise) : null,
        notes: (input.notes || '').trim(), createdAt: now,
        duePaise: openDue, totalPaidPaise: 0, fullCylindersHeld: openFull,
        emptyCylindersOwed: openEmpty, advanceEmptyDeposits: 0
      };
      await reqP(s.customers.put(customer));
      if (openDue !== 0 || openFull > 0 || openEmpty > 0) {
        const txId = genId('OPEN');
        await reqP(s.transactions.put({
          id: txId, type: 'OPENING_BALANCE', createdAt: now, istDate, customerId: customer.id, customerName: customer.name,
          totalAmountPaise: openDue, cashPaise: 0, upiPaise: 0, creditPaise: openDue, quantity: openFull + openEmpty,
          emptyNotReturned: openEmpty, notes: `Opening (Full: ${openFull}, Empty: ${openEmpty})`
        }));
        if (openDue !== 0) {
          await reqP(s.customerMoneyLedger.put({
            id: genId('ML'), txId, customerId: customer.id, createdAt: now, istDate, entryType: 'OPENING_BALANCE',
            description: 'Opening Balance', debitPaise: openDue > 0 ? openDue : 0, creditPaise: openDue < 0 ? Math.abs(openDue) : 0
          }));
        }
        if (openFull > 0 || openEmpty > 0) {
          await reqP(s.emptyCylinderLedger.put({
            id: genId('EL'), txId, customerId: customer.id, createdAt: now, istDate, movementType: 'OPENING_BALANCE',
            owedDelta: openEmpty, advanceDelta: 0, fullHeldDelta: openFull, returnedAtDeliveryCount: 0,
            description: `Opening cylinders (Full: ${openFull}, Empty owed: ${openEmpty})`
          }));
        }
      }
      return customer;
    });
  }

  async function recordPurchase(db, input) {
    const supplierName = (input.supplierName || '').trim();
    if (!supplierName) throw new Error('Supplier name is required.');
    const qty = Math.floor(input.quantity);
    if (qty <= 0) throw new Error('Quantity must be at least 1.');
    const unitPrice = Math.round(input.unitPricePaise);
    if (unitPrice < 0) throw new Error('Price cannot be negative.');
    const cash = Math.max(0, Math.round(input.cashPaise || 0));
    const upi = Math.max(0, Math.round(input.upiPaise || 0));
    const total = qty * unitPrice;
    if (cash + upi > total) throw new Error('Cash + UPI paid cannot exceed total purchase.');
    const now = Date.now(), istDate = getISTDateKey(now);

    return runTx(db, ['inventory', 'transactions'], 'readwrite', async (s) => {
      const inv = await getOrInitInv(s.inventory, input.brand, input.size);
      const bF = inv.fullStock, bE = inv.emptyStock;
      if (input.cylinderState === 'Full') {
        const newQty = inv.fullStock + qty;
        inv.avgCostPaise = newQty > 0 ? Math.round((inv.fullStock * inv.avgCostPaise + total) / newQty) : unitPrice;
        inv.fullStock = newQty;
        inv.lastPurchasePricePaise = unitPrice;
      } else {
        inv.emptyStock += qty;
      }
      inv.updatedAt = now;
      await reqP(s.inventory.put(inv));
      const tx = {
        id: genId('PUR'), type: 'PURCHASE', createdAt: now, istDate, supplierName,
        brand: input.brand, size: input.size, cylinderState: input.cylinderState, quantity: qty,
        unitPricePaise: unitPrice, totalAmountPaise: total, cashPaise: cash, upiPaise: upi,
        upiRef: (input.upiRef || '').trim() || null, creditPaise: total - cash - upi,
        stockBeforeFull: bF, stockBeforeEmpty: bE, stockAfterFull: inv.fullStock, stockAfterEmpty: inv.emptyStock
      };
      await reqP(s.transactions.put(tx));
      return tx;
    });
  }

  async function recordSale(db, input) {
    const qty = Math.floor(input.quantity);
    if (qty <= 0) throw new Error('Sale quantity must be at least 1.');
    const unitPrice = Math.round(input.unitPricePaise);
    if (unitPrice <= 0) throw new Error('Sale price must be > ₹0.');
    const cash = Math.max(0, Math.round(input.cashPaise || 0));
    const upi = Math.max(0, Math.round(input.upiPaise || 0));
    const total = qty * unitPrice;
    const credit = total - (cash + upi);
    if (credit < 0 && !input.allowOverpaymentAsAdvance) {
      throw new Error('Cash + UPI exceeds Total Sale. Enable "Allow Advance Payment" for extra.');
    }
    const rNow = Math.max(0, Math.floor(input.emptyReturnedNow || 0));
    const notRet = Math.max(0, Math.floor(input.emptyNotReturned || 0));
    const advApp = Math.max(0, Math.floor(input.advanceEmptyApplied || 0));
    const advDep = Math.max(0, Math.floor(input.advanceDepositedNow || 0));
    const retLat = Math.max(0, Math.floor(input.emptyToReturnLater || 0));
    if (rNow + notRet + advApp + retLat !== qty) {
      throw new Error(`Empty tracking mismatch: ${rNow}+${notRet}+${advApp}+${retLat} must equal ${qty}.`);
    }
    const now = Date.now(), istDate = getISTDateKey(now);

    return runTx(db, ['customers', 'inventory', 'transactions', 'customerMoneyLedger', 'emptyCylinderLedger'], 'readwrite', async (s) => {
      const cust = await reqP(s.customers.get(input.customerId));
      if (!cust) throw new Error('Select a customer.');
      if (advApp > cust.advanceEmptyDeposits) throw new Error(`Only ${cust.advanceEmptyDeposits} advance empties available.`);
      const inv = await getOrInitInv(s.inventory, input.brand, input.size);
      if (inv.fullStock < qty) throw new Error(`Insufficient Full stock (${inv.fullStock} left) for ${input.brand} ${input.size}.`);

      const bF = inv.fullStock, bE = inv.emptyStock;
      const unitCost = inv.avgCostPaise;
      inv.fullStock -= qty;
      inv.emptyStock += rNow + advDep;
      inv.updatedAt = now;
      await reqP(s.inventory.put(inv));

      cust.duePaise += credit;
      cust.totalPaidPaise += cash + upi;
      cust.emptyCylindersOwed += notRet + retLat;
      cust.advanceEmptyDeposits = cust.advanceEmptyDeposits - advApp + advDep;
      await reqP(s.customers.put(cust));

      const txId = genId('SAL');
      const tx = {
        id: txId, type: 'SALE', createdAt: now, istDate, customerId: cust.id, customerName: cust.name,
        brand: input.brand, size: input.size, cylinderState: 'Full', quantity: qty,
        unitPricePaise: unitPrice, unitCostPaise: unitCost, cogsPaise: unitCost * qty,
        totalAmountPaise: total, cashPaise: cash, upiPaise: upi, upiRef: (input.upiRef || '').trim() || null,
        creditPaise: credit, isAdvancePayment: credit < 0,
        emptyReturnedNow: rNow, emptyNotReturned: notRet, advanceEmptyApplied: advApp,
        advanceDepositedNow: advDep, emptyToReturnLater: retLat, pendingReturnRemaining: retLat,
        stockBeforeFull: bF, stockBeforeEmpty: bE, stockAfterFull: inv.fullStock, stockAfterEmpty: inv.emptyStock,
        notes: (input.notes || '').trim() || null
      };
      await reqP(s.transactions.put(tx));

      await reqP(s.customerMoneyLedger.put({
        id: genId('ML'), txId, customerId: cust.id, createdAt: now, istDate, entryType: 'SALE',
        description: `Sale: ${qty} × ${input.brand} ${input.size}`, debitPaise: total, creditPaise: 0
      }));
      if (cash + upi > 0) {
        await reqP(s.customerMoneyLedger.put({
          id: genId('ML'), txId, customerId: cust.id, createdAt: now + 1, istDate, entryType: 'PAYMENT_RECEIPT',
          description: `Paid at delivery (${cash > 0 ? 'Cash ' : ''}${upi > 0 ? 'UPI' : ''})`,
          debitPaise: 0, creditPaise: cash + upi
        }));
      }
      const addEl = (off, type, oD, aD, retC, desc) => reqP(s.emptyCylinderLedger.put({
        id: genId('EL'), txId, customerId: cust.id, createdAt: now + off, istDate, brand: input.brand, size: input.size,
        movementType: type, owedDelta: oD, advanceDelta: aD, fullHeldDelta: 0, returnedAtDeliveryCount: retC, description: desc
      }));
      if (rNow > 0) await addEl(0, 'DELIVERY_RETURNED', 0, 0, rNow, `${rNow} empty returned at delivery (${input.brand} ${input.size})`);
      if (notRet > 0) await addEl(1, 'DELIVERY_NOT_RETURNED', notRet, 0, 0, `${notRet} empty NOT returned (${input.brand} ${input.size})`);
      if (retLat > 0) await addEl(2, 'DELIVERY_RETURN_LATER', retLat, 0, 0, `${retLat} empty to return later (${input.brand} ${input.size})`);
      if (advApp > 0) await addEl(3, 'ADVANCE_APPLIED', 0, -advApp, 0, `${advApp} advance empty applied (${input.brand} ${input.size})`);
      if (advDep > 0) await addEl(4, 'ADVANCE_DEPOSITED', 0, advDep, 0, `${advDep} advance empty deposited (${input.brand} ${input.size})`);
      return tx;
    });
  }

  async function recordPaymentReceipt(db, input) {
    const cash = Math.max(0, Math.round(input.cashPaise || 0));
    const upi = Math.max(0, Math.round(input.upiPaise || 0));
    const total = cash + upi;
    if (total <= 0) throw new Error('Payment must be > ₹0.');
    const now = Date.now(), istDate = getISTDateKey(now);

    return runTx(db, ['customers', 'transactions', 'customerMoneyLedger'], 'readwrite', async (s) => {
      const cust = await reqP(s.customers.get(input.customerId));
      if (!cust) throw new Error('Customer not found.');
      if (total > cust.duePaise && !input.isAdvancePayment) {
        throw new Error('Payment exceeds pending due. Enable "Advance Payment" to accept extra.');
      }
      cust.duePaise -= total;
      cust.totalPaidPaise += total;
      await reqP(s.customers.put(cust));
      const txId = genId('PAY');
      const tx = {
        id: txId, type: 'PAYMENT_RECEIPT', createdAt: now, istDate, customerId: cust.id, customerName: cust.name,
        totalAmountPaise: total, cashPaise: cash, upiPaise: upi, upiRef: (input.upiRef || '').trim() || null,
        creditPaise: 0, isAdvancePayment: Boolean(input.isAdvancePayment), notes: (input.notes || '').trim() || null
      };
      await reqP(s.transactions.put(tx));
      await reqP(s.customerMoneyLedger.put({
        id: genId('ML'), txId, customerId: cust.id, createdAt: now, istDate,
        entryType: input.isAdvancePayment ? 'ADVANCE_PAYMENT' : 'PAYMENT_RECEIPT',
        description: input.isAdvancePayment ? 'Advance payment received' : 'Due payment collected',
        debitPaise: 0, creditPaise: total
      }));
      return tx;
    });
  }

  async function recordEmptyReturn(db, input) {
    const qty = Math.floor(input.quantity);
    if (qty <= 0) throw new Error('Return qty must be >= 1.');
    const now = Date.now(), istDate = getISTDateKey(now);

    return runTx(db, ['customers', 'inventory', 'transactions', 'emptyCylinderLedger'], 'readwrite', async (s) => {
      const cust = await reqP(s.customers.get(input.customerId));
      if (!cust) throw new Error('Select a customer.');
      let brand = input.brand, size = input.size;
      if (input.linkedSaleTxId) {
        const sale = await reqP(s.transactions.get(input.linkedSaleTxId));
        if (!sale || sale.type !== 'SALE' || sale.isReversed) throw new Error('Invalid linked sale.');
        if ((sale.pendingReturnRemaining || 0) < qty) throw new Error(`Only ${sale.pendingReturnRemaining || 0} pending on this delivery.`);
        sale.pendingReturnRemaining -= qty;
        await reqP(s.transactions.put(sale));
        brand = sale.brand; size = sale.size;
      }
      if (qty > cust.emptyCylindersOwed) throw new Error(`Customer only owes ${cust.emptyCylindersOwed} empty cylinder(s).`);
      const inv = await getOrInitInv(s.inventory, brand, size);
      const bF = inv.fullStock, bE = inv.emptyStock;
      inv.emptyStock += qty; inv.updatedAt = now;
      await reqP(s.inventory.put(inv));
      cust.emptyCylindersOwed -= qty;
      await reqP(s.customers.put(cust));

      const txId = genId('RET');
      const tx = {
        id: txId, type: 'EMPTY_RETURN', createdAt: now, istDate, customerId: cust.id, customerName: cust.name,
        brand, size, cylinderState: 'Empty', quantity: qty, totalAmountPaise: 0, cashPaise: 0, upiPaise: 0, creditPaise: 0,
        linkedSaleTxId: input.linkedSaleTxId || null, stockBeforeFull: bF, stockBeforeEmpty: bE,
        stockAfterFull: inv.fullStock, stockAfterEmpty: inv.emptyStock
      };
      await reqP(s.transactions.put(tx));
      await reqP(s.emptyCylinderLedger.put({
        id: genId('EL'), txId, customerId: cust.id, createdAt: now, istDate, brand, size,
        movementType: 'LATER_RETURN', owedDelta: -qty, advanceDelta: 0, fullHeldDelta: 0, returnedAtDeliveryCount: 0,
        description: `${qty} owed empty returned (${brand} ${size})`
      }));
      return tx;
    });
  }

  async function recordStockAdjustment(db, input) {
    const aF = Math.floor(input.actualFullStock), aE = Math.floor(input.actualEmptyStock);
    if (aF < 0 || aE < 0) throw new Error('Stock cannot be negative.');
    const reason = (input.reason || '').trim();
    if (!reason) throw new Error('Reason is required.');
    const now = Date.now(), istDate = getISTDateKey(now);

    return runTx(db, ['inventory', 'transactions'], 'readwrite', async (s) => {
      const inv = await getOrInitInv(s.inventory, input.brand, input.size);
      const bF = inv.fullStock, bE = inv.emptyStock;
      if (aF === bF && aE === bE) throw new Error('No variance to adjust.');
      inv.fullStock = aF; inv.emptyStock = aE;
      if (input.unitCostOverridePaise > 0 && inv.avgCostPaise === 0) inv.avgCostPaise = Math.round(input.unitCostOverridePaise);
      inv.updatedAt = now;
      await reqP(s.inventory.put(inv));
      const tx = {
        id: genId('ADJ'), type: 'STOCK_ADJUSTMENT', createdAt: now, istDate, brand: input.brand, size: input.size,
        quantity: aF - bF, totalAmountPaise: 0, cashPaise: 0, upiPaise: 0, creditPaise: 0, reason,
        stockBeforeFull: bF, stockBeforeEmpty: bE, stockAfterFull: aF, stockAfterEmpty: aE
      };
      await reqP(s.transactions.put(tx));
      return tx;
    });
  }

  async function reverseTransaction(db, txId, reason = 'Mistaken entry reversed') {
    const now = Date.now(), istDate = getISTDateKey(now);
    return runTx(db, ['customers', 'inventory', 'transactions', 'customerMoneyLedger', 'emptyCylinderLedger'], 'readwrite', async (s) => {
      const orig = await reqP(s.transactions.get(txId));
      if (!orig) throw new Error('Transaction not found.');
      if (orig.type === 'REVERSAL') throw new Error('Cannot reverse a REVERSAL.');
      if (orig.isReversed) throw new Error('Transaction already reversed.');
      if (orig.type === 'OPENING_BALANCE') throw new Error('Cannot reverse opening balance.');
      const revId = genId('REV');

      if (orig.type === 'SALE') {
        if ((orig.emptyToReturnLater || 0) - (orig.pendingReturnRemaining || 0) > 0) {
          throw new Error('Reverse linked empty return first.');
        }
        const inv = await getOrInitInv(s.inventory, orig.brand, orig.size);
        const empDed = (orig.emptyReturnedNow || 0) + (orig.advanceDepositedNow || 0);
        if (inv.emptyStock < empDed) throw new Error('Warehouse empty stock too low to reverse.');
        inv.fullStock += orig.quantity; inv.emptyStock -= empDed; inv.updatedAt = now;
        await reqP(s.inventory.put(inv));

        const cust = await reqP(s.customers.get(orig.customerId));
        if (cust) {
          cust.duePaise -= orig.creditPaise;
          cust.totalPaidPaise -= orig.cashPaise + orig.upiPaise;
          cust.emptyCylindersOwed -= (orig.emptyNotReturned || 0) + (orig.emptyToReturnLater || 0);
          cust.advanceEmptyDeposits += (orig.advanceEmptyApplied || 0) - (orig.advanceDepositedNow || 0);
          await reqP(s.customers.put(cust));
          await reqP(s.customerMoneyLedger.put({
            id: genId('ML'), txId: revId, customerId: cust.id, createdAt: now, istDate, entryType: 'REVERSAL',
            description: `Reversal of Sale ${orig.id}: ${reason}`, debitPaise: orig.cashPaise + orig.upiPaise, creditPaise: orig.totalAmountPaise
          }));
          const oD = -((orig.emptyNotReturned || 0) + (orig.emptyToReturnLater || 0));
          const aD = (orig.advanceEmptyApplied || 0) - (orig.advanceDepositedNow || 0);
          if (oD !== 0 || aD !== 0) {
            await reqP(s.emptyCylinderLedger.put({
              id: genId('EL'), txId: revId, customerId: cust.id, createdAt: now, istDate, brand: orig.brand, size: orig.size,
              movementType: 'REVERSAL', owedDelta: oD, advanceDelta: aD, fullHeldDelta: 0, returnedAtDeliveryCount: 0,
              description: `Reversal of Sale ${orig.id}`
            }));
          }
        }
      } else if (orig.type === 'PURCHASE') {
        const inv = await getOrInitInv(s.inventory, orig.brand, orig.size);
        if (orig.cylinderState === 'Full') {
          if (inv.fullStock < orig.quantity) throw new Error('Full stock too low to reverse purchase.');
          const rem = inv.fullStock - orig.quantity;
          inv.avgCostPaise = rem > 0 ? Math.max(0, Math.round((inv.fullStock * inv.avgCostPaise - orig.totalAmountPaise) / rem)) : 0;
          inv.fullStock = rem;
        } else {
          if (inv.emptyStock < orig.quantity) throw new Error('Empty stock too low to reverse.');
          inv.emptyStock -= orig.quantity;
        }
        inv.updatedAt = now;
        await reqP(s.inventory.put(inv));
      } else if (orig.type === 'PAYMENT_RECEIPT') {
        const cust = await reqP(s.customers.get(orig.customerId));
        if (cust) {
          cust.duePaise += orig.totalAmountPaise;
          cust.totalPaidPaise -= orig.totalAmountPaise;
          await reqP(s.customers.put(cust));
          await reqP(s.customerMoneyLedger.put({
            id: genId('ML'), txId: revId, customerId: cust.id, createdAt: now, istDate, entryType: 'REVERSAL',
            description: `Reversal of Payment ${orig.id}: ${reason}`, debitPaise: orig.totalAmountPaise, creditPaise: 0
          }));
        }
      } else if (orig.type === 'EMPTY_RETURN') {
        const inv = await getOrInitInv(s.inventory, orig.brand, orig.size);
        if (inv.emptyStock < orig.quantity) throw new Error('Empty stock too low to reverse return.');
        inv.emptyStock -= orig.quantity; inv.updatedAt = now;
        await reqP(s.inventory.put(inv));
        if (orig.linkedSaleTxId) {
          const ls = await reqP(s.transactions.get(orig.linkedSaleTxId));
          if (ls) { ls.pendingReturnRemaining = (ls.pendingReturnRemaining || 0) + orig.quantity; await reqP(s.transactions.put(ls)); }
        }
        const cust = await reqP(s.customers.get(orig.customerId));
        if (cust) {
          cust.emptyCylindersOwed += orig.quantity;
          await reqP(s.customers.put(cust));
          await reqP(s.emptyCylinderLedger.put({
            id: genId('EL'), txId: revId, customerId: cust.id, createdAt: now, istDate, brand: orig.brand, size: orig.size,
            movementType: 'REVERSAL', owedDelta: orig.quantity, advanceDelta: 0, fullHeldDelta: 0, returnedAtDeliveryCount: 0,
            description: `Reversal of Empty Return ${orig.id}`
          }));
        }
      } else if (orig.type === 'EMPTY_ADVANCE_DEPOSIT') {
        const cust = await reqP(s.customers.get(orig.customerId));
        if (cust) {
          if (cust.advanceEmptyDeposits < orig.quantity) throw new Error('Advance deposit already applied.');
          cust.advanceEmptyDeposits -= orig.quantity;
          await reqP(s.customers.put(cust));
        }
        const inv = await getOrInitInv(s.inventory, orig.brand, orig.size);
        if (inv.emptyStock < orig.quantity) throw new Error('Empty stock too low to reverse.');
        inv.emptyStock -= orig.quantity; inv.updatedAt = now;
        await reqP(s.inventory.put(inv));
      } else if (orig.type === 'STOCK_ADJUSTMENT') {
        const inv = await getOrInitInv(s.inventory, orig.brand, orig.size);
        const fD = (orig.stockAfterFull || 0) - (orig.stockBeforeFull || 0);
        const eD = (orig.stockAfterEmpty || 0) - (orig.stockBeforeEmpty || 0);
        if (inv.fullStock - fD < 0 || inv.emptyStock - eD < 0) throw new Error('Reversal causes negative stock.');
        inv.fullStock -= fD; inv.emptyStock -= eD; inv.updatedAt = now;
        await reqP(s.inventory.put(inv));
      }

      const revTx = {
        id: revId, type: 'REVERSAL', createdAt: now, istDate, customerId: orig.customerId, customerName: orig.customerName,
        supplierName: orig.supplierName, brand: orig.brand, size: orig.size, quantity: orig.quantity ? -orig.quantity : null,
        cogsPaise: orig.cogsPaise ? -orig.cogsPaise : 0, totalAmountPaise: -orig.totalAmountPaise,
        cashPaise: -orig.cashPaise, upiPaise: -orig.upiPaise, creditPaise: -orig.creditPaise,
        isAdvancePayment: orig.isAdvancePayment, reversesTxId: orig.id, reversesType: orig.type, reason
      };
      orig.isReversed = true; orig.reversedByTxId = revId;
      await reqP(s.transactions.put(orig));
      await reqP(s.transactions.put(revTx));
      return revTx;
    });
  }

  async function computeMetrics(db, startDate, endDate) {
    const [allTxs, custs, invs, daily] = await Promise.all([
      getAll(db, 'transactions'), getAll(db, 'customers'), getAll(db, 'inventory'), getByKey(db, 'dailyCash', startDate)
    ]);
    const txs = allTxs.filter((t) => t.istDate >= startDate && t.istDate <= endDate);
    let sales = 0, purchases = 0, cashSales = 0, cashColl = 0, upiColl = 0, creditSales = 0, exp = 0, cashExp = 0, cogs = 0;
    let cashIn = 0, upiIn = 0, cashOut = 0, upiOut = 0;
    for (const t of txs) {
      const eff = t.type === 'REVERSAL' ? t.reversesType : t.type;
      if (eff === 'SALE') {
        sales += t.totalAmountPaise; cashSales += t.cashPaise; upiColl += t.upiPaise;
        if (!t.isAdvancePayment) creditSales += t.creditPaise;
        cogs += t.cogsPaise || 0; cashIn += t.cashPaise; upiIn += t.upiPaise;
      } else if (eff === 'PURCHASE') {
        purchases += t.totalAmountPaise; cashOut += t.cashPaise; upiOut += t.upiPaise;
      } else if (eff === 'PAYMENT_RECEIPT') {
        cashColl += t.cashPaise; upiColl += t.upiPaise; cashIn += t.cashPaise; upiIn += t.upiPaise;
      } else if (eff === 'EXPENSE') {
        exp += t.totalAmountPaise; cashExp += t.cashPaise; cashOut += t.cashPaise; upiOut += t.upiPaise;
      } else if (eff === 'SUPPLIER_PAYMENT') {
        cashOut += t.cashPaise; upiOut += t.upiPaise;
      }
    }
    const supMap = new Map();
    for (const t of allTxs) {
      const eff = t.type === 'REVERSAL' ? t.reversesType : t.type;
      if (eff === 'PURCHASE' && t.supplierName) supMap.set(t.supplierName, (supMap.get(t.supplierName) || 0) + t.creditPaise);
      if (eff === 'SUPPLIER_PAYMENT' && t.supplierName) supMap.set(t.supplierName, (supMap.get(t.supplierName) || 0) - t.totalAmountPaise);
    }
    const supplierPayables = Array.from(supMap.entries()).map(([supplierName, payablePaise]) => ({ supplierName, payablePaise })).filter((x) => x.payablePaise !== 0);
    const supplierPayableOutstanding = supplierPayables.reduce((a, b) => a + Math.max(0, b.payablePaise), 0);

    let marketDue = 0, custAdv = 0, custEmpties = 0, custAdvEmpties = 0;
    custs.forEach((c) => {
      if (c.duePaise > 0) marketDue += c.duePaise;
      if (c.duePaise < 0) custAdv += Math.abs(c.duePaise);
      custEmpties += c.emptyCylindersOwed; custAdvEmpties += c.advanceEmptyDeposits;
    });
    let fullStock = 0, emptyStock = 0;
    invs.forEach((i) => { fullStock += i.fullStock; emptyStock += i.emptyStock; });
    const openingCash = daily ? daily.openingCashPaise : 0;
    const galla = openingCash + cashSales + cashColl - cashExp;
    const gross = sales - cogs, net = gross - exp;
    return {
      sales, purchases, cashSales, cashColl, upiColl, creditSales, marketDue, custAdv,
      openingCash, galla, fullStock, emptyStock, custEmpties, custAdvEmpties,
      exp, cashExp, cogs, gross, net, cashIn, upiIn, cashOut, upiOut,
      netCashFlow: cashIn + upiIn - (cashOut + upiOut), supplierPayables, supplierPayableOutstanding
    };
  }

      });

      });
      await check(4, '5-Mode Empty Cylinder Tracking', async () => {
        const c = await getByKey(tdb, 'customers', cust.id);
        const inv = await getByKey(tdb, 'inventory', invKey('Bharatgas', '14.2 kg'));
        assert(inv.emptyStock === 2 && c.emptyCylindersOwed === 3 && c.advanceEmptyDeposits === 1, 'Empty tracking mismatch');
        return 'EmptyStock=2, Owed=3, Adv=1';
      });
      await check(5, 'Negative Stock Blocking', async () => {
        let blocked = false;
        try { await recordSale(tdb, { customerId: cust.id, brand: 'Bharatgas', size: '14.2 kg', quantity: 20, unitPricePaise: toPaise('1000'), cashPaise: 0, upiPaise: 0, emptyReturnedNow: 20, emptyNotReturned: 0, advanceEmptyApplied: 0, advanceDepositedNow: 0, emptyToReturnLater: 0 }); }
        catch { blocked = true; }
        assert(blocked, 'Over-sell not blocked');
        return 'Blocked selling 20 when 16 in stock';
      });
      await check(6, 'Advance Empty Block & No Double-Count', async () => {
        let blk = false;
        try { await recordSale(tdb, { customerId: cust.id, brand: 'Bharatgas', size: '14.2 kg', quantity: 2, unitPricePaise: toPaise('1000'), cashPaise: 0, upiPaise: 0, emptyReturnedNow: 0, emptyNotReturned: 0, advanceEmptyApplied: 2, advanceDepositedNow: 0, emptyToReturnLater: 0 }); }
        catch { blk = true; }
        assert(blk, 'Over-advance not blocked');
        sale2 = await recordSale(tdb, { customerId: cust.id, brand: 'Bharatgas', size: '14.2 kg', quantity: 1, unitPricePaise: toPaise('1000'), cashPaise: toPaise('1000'), upiPaise: 0, emptyReturnedNow: 0, emptyNotReturned: 0, advanceEmptyApplied: 1, advanceDepositedNow: 0, emptyToReturnLater: 0 });
        const inv = await getByKey(tdb, 'inventory', invKey('Bharatgas', '14.2 kg'));
        assert(inv.emptyStock === 2, 'Double-counted emptyStock');
        return 'Adv=0, EmptyStock stayed 2';
      });
      await check(7, 'Later Return & Double-Return Block', async () => {
        await recordEmptyReturn(tdb, { customerId: cust.id, brand: 'Bharatgas', size: '14.2 kg', quantity: 2, linkedSaleTxId: sale1.id });
        let blk = false;
        try { await recordEmptyReturn(tdb, { customerId: cust.id, brand: 'Bharatgas', size: '14.2 kg', quantity: 1, linkedSaleTxId: sale1.id }); }
        catch { blk = true; }
        const c = await getByKey(tdb, 'customers', cust.id);
        assert(blk && c.emptyCylindersOwed === 1, 'Double-return not blocked');
        return 'Settled 2 pending, blocked repeat';
      });
      await check(8, 'Galla Cash & Advance Revenue Exclusion', async () => {
        await runTx(tdb, ['dailyCash'], 'readwrite', (s) => reqP(s.dailyCash.put({ istDate: today, openingCashPaise: toPaise('5000'), updatedAt: Date.now() })));
        await recordExpense(tdb, { category: 'Petrol', amountPaise: toPaise('300'), paymentMode: 'Cash' });
        await recordPaymentReceipt(tdb, { customerId: cust.id, cashPaise: toPaise('1000'), upiPaise: 0, isAdvancePayment: true });
        const m = await computeMetrics(tdb, today, today);
        assert(m.galla === toPaise('8200') && m.sales === toPaise('5000'), 'Galla/Revenue mismatch');
        return 'Galla ₹8,200, Sales ₹5,000 (adv excluded)';
      });
      await check(9, 'COGS, Gross/Net Profit & Supplier Payable', async () => {
        const m = await computeMetrics(tdb, today, today);
        assert(m.cogs === toPaise('4250') && m.gross === toPaise('750') && m.net === toPaise('450') && m.supplierPayableOutstanding === toPaise('5000'), 'P&L mismatch');
        return 'Net Profit ₹450.00, Payable ₹5,000.00';
      });
      await check(10, 'Audited Reversal & Double-Reversal Block', async () => {
        await reverseTransaction(tdb, sale2.id, 'Test rev');
        let blk = false;
        try { await reverseTransaction(tdb, sale2.id, 'Second'); } catch { blk = true; }
        const inv = await getByKey(tdb, 'inventory', invKey('Bharatgas', '14.2 kg'));
        assert(blk && inv.fullStock === 16, 'Reversal mismatch');
        return 'Stock restored, repeat reversal blocked';
      });
    } finally {
      tdb.close();
      indexedDB.deleteDatabase(tName);
    }
    return res;
  }

  // ---------- PIN SCREEN ----------
  function renderPin() {
    const dots = document.getElementById('pinDots');
    dots.innerHTML = [0, 1, 2, 3].map((i) => `<div style="width:14px;height:14px;border-radius:50%;border:2px solid #ea580c;background:${pinEntry.length > i ? '#ea580c' : 'transparent'}"></div>`).join('');
  }
  function initPinPad() {
    const pad = document.getElementById('pinPad');
    const keys = ['1','2','3','4','5','6','7','8','9','','0','DEL'];
    pad.innerHTML = keys.map((k) => k === '' ? '<div></div>' : `<button type="button" data-pin="${k}">${k}</button>`).join('');
    pad.onclick = (e) => {
      const btn = e.target.closest('button[data-pin]');
      if (!btn) return;
      const val = btn.dataset.pin;
      document.getElementById('pinErr').textContent = '';
      if (val === 'DEL') { pinEntry = pinEntry.slice(0, -1); renderPin(); return; }
      if (pinEntry.length >= 4) return;
      pinEntry += val; renderPin();
      if (pinEntry.length === 4) {
        if (pinEntry === savedPin) {
          pinEntry = '';
          document.getElementById('pinScreen').classList.add('hidden');
        } else {
          document.getElementById('pinErr').textContent = 'Incorrect PIN';
          setTimeout(() => { pinEntry = ''; renderPin(); }, 300);
        }
      }
    };
  }

  }

            <strong style="font-size:13px;">Payment Split</strong>

            <div><label>UPI (₹)</label><input id="sUpi" type="text" inputmode="decimal" placeholder="0"></div>
          </div>
          <input id="sUpiRef" type="text" placeholder="UPI Ref (optional)" class="field-gap">

      </form>`;

    const cSel = document.getElementById('sCust'), bSel = document.getElementById('sBrand'), szSel = document.getElementById('sSize');
    const qInp = document.getElementById('sQty'), pInp = document.getElementById('sPrice');
    const cashInp = document.getElementById('sCash'), upiInp = document.getElementById('sUpi');
    const rN = document.getElementById('eRetNow'), nR = document.getElementById('eNotRet'), aA = document.getElementById('eAdvApp'), rL = document.getElementById('eRetLat');

    function recalc() {
      const q = Math.max(0, parseInt(qInp.value || '0', 10) || 0);
      const tot = q * toPaise(pInp.value);
      document.getElementById('sTotal').textContent = formatINR(tot);
      const cred = tot - (toPaise(cashInp.value) + toPaise(upiInp.value));
      const cBox = document.getElementById('sCreditBox');
      cBox.className = `box row ${cred < 0 ? 'box-indigo' : cred > 0 ? 'box-red' : 'box-green'}`;
      cBox.innerHTML = `<span>${cred < 0 ? 'Advance Paid:' : 'Pending Credit:'}</span><span>${formatINR(Math.abs(cred))}</span>`;
      document.getElementById('sAdvWrap').classList.toggle('hidden', cred >= 0);

      const inv = invMap.get(invKey(bSel.value, szSel.value));
      const av = inv ? inv.fullStock : 0;
      const sh = document.getElementById('stockHint');
      sh.className = `box field-gap ${av >= q && av > 0 ? 'box-green text-green' : 'box-red text-red'}`;
      sh.textContent = `Warehouse Full (${bSel.value} ${szSel.value}): ${av} cylinders`;

      const alloc = (parseInt(rN.value||0,10)||0) + (parseInt(nR.value||0,10)||0) + (parseInt(aA.value||0,10)||0) + (parseInt(rL.value||0,10)||0);
      const ab = document.getElementById('allocBadge');
      ab.textContent = `Allocated: ${alloc} / ${q}`;
      ab.style.background = alloc === q ? '#d1fae5' : '#ffe4e6';
      ab.style.color = alloc === q ? '#065f46' : '#9f1239';
    }

    cSel.onchange = () => {
      const cust = custs.find((x) => x.id === cSel.value);
      const w = document.getElementById('custWarn');
      if (cust) {
        if (cust.contractPricePaise) pInp.value = paiseInput(cust.contractPricePaise);
        w.classList.remove('hidden');
        w.innerHTML = `⚠️ <b>${esc(cust.name)}</b> • Due: <b class="${cust.duePaise>0?'text-red':'text-green'}">${formatINR(cust.duePaise)}</b> • Owed Empties: <b>${cust.emptyCylindersOwed}</b> • Adv Empties: <b>${cust.advanceEmptyDeposits}</b>`;
        document.getElementById('eAdvLbl').textContent = `3. Apply Prior Adv. (Max ${cust.advanceEmptyDeposits})`;
      } else { w.classList.add('hidden'); }
      recalc();
    };
    qInp.oninput = () => {
      if ((parseInt(nR.value||0,10)||0)===0 && (parseInt(aA.value||0,10)||0)===0 && (parseInt(rL.value||0,10)||0)===0) rN.value = qInp.value;
      recalc();
    };
    [bSel, szSel, pInp, cashInp, upiInp, rN, nR, aA, rL].forEach((x) => { x.oninput = recalc; x.onchange = recalc; });
    document.getElementById('btnAllCash').onclick = () => {
      const tot = (parseInt(qInp.value||0,10)||0) * toPaise(pInp.value);
      cashInp.value = paiseInput(tot); upiInp.value = ''; recalc();
    };
    document.getElementById('btnAllUpi').onclick = () => {
      const tot = (parseInt(qInp.value||0,10)||0) * toPaise(pInp.value);
      cashInp.value = ''; upiInp.value = paiseInput(tot); recalc();
    };
    el.querySelectorAll('button[data-qm]').forEach((b) => {
      b.onclick = () => {
        const q = qInp.value || '0';
        aA.value = '0';
        if (b.dataset.qm === 'all') { rN.value = q; nR.value = '0'; rL.value = '0'; }
        else if (b.dataset.qm === 'none') { rN.value = '0'; nR.value = q; rL.value = '0'; }
        else { rN.value = '0'; nR.value = '0'; rL.value = q; }
        recalc();
      };
    });
    recalc();

    document.getElementById('saleForm').onsubmit = async (ev) => {
      ev.preventDefault();
      try {
        await recordSale(db, {
          customerId: cSel.value, brand: bSel.value, size: szSel.value,
          quantity: parseInt(qInp.value, 10), unitPricePaise: toPaise(pInp.value),
          cashPaise: toPaise(cashInp.value), upiPaise: toPaise(upiInp.value),
          upiRef: document.getElementById('sUpiRef').value,
          allowOverpaymentAsAdvance: document.getElementById('sAllowAdv').checked,
          emptyReturnedNow: parseInt(rN.value || '0', 10), emptyNotReturned: parseInt(nR.value || '0', 10),
          advanceEmptyApplied: parseInt(aA.value || '0', 10), advanceDepositedNow: parseInt(document.getElementById('eAdvDep').value || '0', 10),
          emptyToReturnLater: parseInt(rL.value || '0', 10), notes: document.getElementById('sNotes').value
        });
        notify(true, 'Sale & delivery saved!'); render();
      } catch (err) { notify(false, err.message); }
    };
  }

              <span><b>${esc(sp.supplierName)}</b>: ${formatINR(sp.payablePaise)}</span>

          const amt = prompt(`Cash ₹ paid to ${b.dataset.paysup}:`, '0');
          if (amt === null) return;
          try { await recordSupplierPayment(db, { supplierName: b.dataset.paysup, cashPaise: toPaise(amt), upiPaise: 0 }); notify(true, 'Supplier paid.'); render(); }
          catch (err) { notify(false, err.message); }
        };
      });
    } else if (moreSub === 'exp') {
      body.innerHTML = `
        <form id="expForm" class="card">
          <h3 style="margin:0 0 10px;">Add Operating Expense</h3>

      document.getElementById('expForm').onsubmit = async (ev) => {
        ev.preventDefault();

        } catch (err) { notify(false, err.message); }
      };
    } else if (moreSub === 'audit') {
      body.innerHTML = `
        <div class="card">
          <h3 style="margin:0 0 4px;">Audit Log & Reversals</h3>
          <p class="muted" style="margin:0 0 10px;">Entries are never deleted; reverse mistakes via REVERSAL.</p>
          ${allTxs.slice(0, 120).map((t) => {
            const canRev = t.type !== 'REVERSAL' && t.type !== 'OPENING_BALANCE' && !t.isReversed;
            return `<div class="list-item">
              <div>
                <span class="pill" style="background:${t.type==='REVERSAL'?'#f3e8ff':'#ffedd5'};color:${t.type==='REVERSAL'?'#6b21a8':'#9a3412'};">${t.type}</span>
                ${t.isReversed ? `<span class="pill" style="background:#ffe4e6;color:#9f1239;">REVERSED</span>` : ''}
                <div style="font-size:13px;font-weight:700;margin-top:3px;">${esc(t.customerName || t.supplierName || t.category || t.brand || t.id)} ${t.brand && t.size ? `• ${t.quantity}× ${t.brand} ${t.size}` : ''}</div>
                <div class="muted">${fmtDateIST(t.createdAt)} ${fmtTimeIST(t.createdAt)} • ${esc(t.id)}</div>
              </div>
              <div style="text-align:right;">
                ${t.totalAmountPaise ? `<div style="font-weight:700;">${formatINR(t.totalAmountPaise)}</div>` : ''}
                ${canRev ? `<button type="button" data-rev="${esc(t.id)}" class="btn-light btn-sm" style="margin-top:4px;color:#be123c;border-color:#fecdd3;">Reverse</button>` : ''}
              </div>
            </div>`;
          }).join('') || '<p class="muted">No transactions yet.</p>'}
        </div>`;
      body.querySelectorAll('button[data-rev]').forEach((b) => {
        b.onclick = async () => {
          const r = prompt('Reason for reversing this entry?', 'Mistaken entry');
          if (!r) return;
          try { await reverseTransaction(db, b.dataset.rev, r); notify(true, 'Entry reversed!'); render(); }
          catch (err) { notify(false, err.message); }
        };
      });
    } else {
      body.innerHTML = `
        <div class="card">
          <h3 style="margin:0 0 8px;">Backup, Restore & CSV</h3>
          <div class="grid2 field-gap">
            <button type="button" id="dlBak" class="btn-dark">⬇️ Backup (.json)</button>
            <button type="button" id="ulBakBtn" class="btn-light">⬆️ Restore (.json)</button>
            <input type="file" id="ulBak" accept=".json,application/json" class="hidden">
          </div>
          <div class="grid2">
            <button type="button" id="csvCust" class="btn-light btn-sm">📄 Customers CSV</button>
            <button type="button" id="csvPnl" class="btn-light btn-sm">📄 P&L CSV</button>
          </div>
        </div>

        <div class="card">
          <h3 style="margin:0 0 8px;">🔒 App PIN Security</h3>
          ${savedPin

            : `<form id="pinForm" style="display:flex;gap:8px;"><input id="newPin" type="password" inputmode="numeric" maxlength="4" placeholder="Set 4-digit PIN" style="flex:1;"><button type="submit" class="btn-primary" style="width:auto;padding:0 16px;">Enable</button></form>`}
        </div>

                <b>${r.passed?'✅':'❌'} #${r.id}. ${esc(r.name)}</b><div class="muted" style="color:inherit;">${esc(r.details)}</div>

          </div>
        </div>`;

      document.getElementById('dlBak').onclick = async () => {
        const stores = ['customers','inventory','transactions','customerMoneyLedger','emptyCylinderLedger','settings','dailyCash'];

        downloadFile(`krishna-backup-${getISTDateKey()}.json`, JSON.stringify({ app: 'Krishna Enterprises', schemaVersion: 1, data }, null, 2), 'application/json');
        notify(true, 'JSON Backup downloaded!');
      };
      document.getElementById('ulBakBtn').onclick = () => document.getElementById('ulBak').click();
      document.getElementById('ulBak').onchange = async (ev) => {
        const f = ev.target.files[0]; if (!f) return;
        if (!confirm('Replace ALL data on this phone with backup?')) { ev.target.value = ''; return; }
        try {
          const parsed = JSON.parse(await f.text());
          const d = parsed.data;
          if (!d || !Array.isArray(d.customers)) throw new Error('Invalid backup file.');
          const stores = ['customers','inventory','transactions','customerMoneyLedger','emptyCylinderLedger','settings','dailyCash'];
          await runTx(db, stores, 'readwrite', async (s) => {
            for (const st of stores) {
              await reqP(s[st].clear());
              for (const item of (d[st] || [])) await reqP(s[st].put(item));
            }
          });
          await refreshPinState(); notify(true, 'Backup restored!'); render();
        } catch (err) { notify(false, err.message); }
      };
      document.getElementById('csvCust').onclick = async () => {
        const cs = await getAll(db, 'customers');
        const rows = ['ID,Name,Phone,Type,Due_INR,Paid_INR,Full_Held,Empty_Owed,Adv_Empty']
          .concat(cs.map((c) => [c.id,c.name,c.phone,c.type,(c.duePaise/100).toFixed(2),(c.totalPaidPaise/100).toFixed(2),c.fullCylindersHeld,c.emptyCylindersOwed,c.advanceEmptyDeposits].map(csvCell).join(',')));
        downloadFile(`krishna-customers-${getISTDateKey()}.csv`, rows.join('\n'), 'text/csv');
      };
      document.getElementById('csvPnl').onclick = () => {

        downloadFile(`krishna-pnl-${getISTDateKey()}.csv`, rows.join('\n'), 'text/csv');
      };
      const pf = document.getElementById('pinForm');
      if (pf) pf.onsubmit = async (ev) => {
        ev.preventDefault();
        const p = document.getElementById('newPin').value.trim();
        if (!/^\d{4}$/.test(p)) return notify(false, 'Enter 4 digits.');
        await runTx(db, ['settings'], 'readwrite', (s) => reqP(s.settings.put({ key: 'pinCode', value: p })));
        await refreshPinState(); notify(true, 'PIN enabled!'); render();
      };
      const op = document.getElementById('offPin');
      if (op) op.onclick = async () => {
        await runTx(db, ['settings'], 'readwrite', (s) => reqP(s.settings.delete('pinCode')));
        await refreshPinState(); notify(true, 'PIN disabled.'); render();
      };
      document.getElementById('runTest').onclick = async () => {
        testResults = await runSelfTest();
        const ok = testResults.filter((x) => x.passed).length;
        notify(ok === 10, `${ok}/10 Self-Test checks passed!`); render();
      };
    }
  }

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('#bottomNav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
    render();
  }

  async function refreshPinState() {
    const rec = await getByKey(db, 'settings', 'pinCode');
    savedPin = rec ? String(rec.value) : null;
    document.getElementById('lockBtn').classList.toggle('hidden', !savedPin);
  }

  async function boot() {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

    const updNet = () => document.getElementById('offlineBadge').classList.toggle('hidden', navigator.onLine);
    window.addEventListener('online', updNet); window.addEventListener('offline', updNet); updNet();

    db = await openDB(MAIN_DB_NAME);
    initPinPad();
    await refreshPinState();
    if (savedPin) { renderPin(); document.getElementById('pinScreen').classList.remove('hidden'); }
    document.getElementById('lockBtn').onclick = () => { pinEntry = ''; renderPin(); document.getElementById('pinScreen').classList.remove('hidden'); };
    document.getElementById('bottomNav').onclick = (e) => {
      const b = e.target.closest('button[data-tab]');
      if (b) switchTab(b.dataset.tab);
    };
    await render();
  }

  boot();
})();
</script>
</body>
</html>
